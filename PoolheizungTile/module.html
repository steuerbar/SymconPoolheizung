<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:light dark;--line:color-mix(in srgb,CanvasText 16%,transparent);--panel:color-mix(in srgb,Canvas 92%,transparent);--hot:#f0782c;--hot2:#e8a33d;--cold:#129bc9;--cold2:#38b7d7;--ok:#20a36b;--danger:#dc5362;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;color:CanvasText}body{padding:8px}.card{position:relative;height:100%;min-height:226px;padding:9px;border:1px solid var(--line);border-radius:16px;background:radial-gradient(circle at 15% 20%,#ffd84d18,transparent 28%),radial-gradient(circle at 87% 30%,#25bfe819,transparent 30%),var(--panel);overflow:hidden}.title-space{height:28px}.actions{position:absolute;left:50%;bottom:7px;z-index:8;display:flex;gap:7px;transform:translateX(-50%)}.actions button{height:27px;min-width:72px;padding:2px 13px;border:1px solid var(--line);border-radius:8px;color:#fff;font:.68rem system-ui;font-weight:800;cursor:pointer}.start{background:#1e9d69}.stop{background:#d04b5b}.schema{height:calc(100% - 62px);min-height:156px}svg{width:100%;height:100%}.base{fill:none;stroke:color-mix(in srgb,CanvasText 15%,transparent);stroke-width:18;stroke-linecap:round}.flow{fill:none;stroke-width:5;stroke-linecap:round;stroke-dasharray:3 12;opacity:.22}.on .flow{opacity:1;animation:flow 1.1s linear infinite}.secondary .flow{animation-direction:reverse}@keyframes flow{to{stroke-dashoffset:-30}}.unit{fill:color-mix(in srgb,Canvas 88%,transparent);stroke:var(--line);stroke-width:1.5}.plate{stroke:color-mix(in srgb,CanvasText 45%,transparent);stroke-width:4}.pump{fill:Canvas;stroke:color-mix(in srgb,CanvasText 24%,transparent);stroke-width:2}.on .pump{stroke:var(--ok);filter:drop-shadow(0 0 5px #20a36b99)}.rotor{transform-box:fill-box;transform-origin:center}.on .rotor{animation:spin 1.4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.weather-symbol{font:32px "Segoe UI Emoji","Apple Color Emoji",sans-serif;line-height:1;text-align:center}.asset{filter:drop-shadow(0 4px 5px color-mix(in srgb,CanvasText 20%,transparent));transform-box:fill-box;transform-origin:center}.primary.on .solar-asset{animation:pulse 2.3s ease-in-out infinite}.secondary.on .pool-asset{animation:float 2.6s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.035);filter:drop-shadow(0 5px 9px #f6c63888)}}@keyframes float{50%{transform:translateY(-2px)}}.label{font-size:8px;font-weight:800;letter-spacing:.08em;fill:currentColor;opacity:.58}.value{font-size:14px;font-weight:850;fill:currentColor}.name{font-size:10px;font-weight:800;fill:currentColor}.offline{position:absolute;inset:40px 10px 40px;display:grid;place-items:center;text-align:center;border-radius:11px;background:color-mix(in srgb,Canvas 91%,var(--danger) 9%);color:var(--danger);font-size:.68rem;font-weight:750}[hidden]{display:none!important}
</style></head><body>
<section class="card">
 <div class="title-space"></div>
 <div class="actions"><button class="start" id="start">▶ Start</button><button class="stop" id="stop">■ Stopp</button></div>
 <div class="schema"><svg viewBox="0 22 420 193" aria-label="Hydraulikschema der Poolheizung">
  <g class="primary" id="primary"><path class="base" d="M50 70H170Q188 70 188 88V157Q188 175 170 175H50Q30 175 30 155V90Q30 70 50 70"/><path class="flow" stroke="var(--hot)" d="M50 70H170Q188 70 188 88V120"/><path class="flow" stroke="var(--hot2)" d="M188 122V157Q188 175 170 175H50"/>
   <circle class="pump" cx="110" cy="175" r="15"/><path class="rotor" d="M110 163l7 12-7 12-7-12z" fill="var(--hot)"/>
  </g>
  <g class="secondary" id="secondary"><path class="base" d="M370 70H250Q232 70 232 88V157Q232 175 250 175H370Q390 175 390 155V90Q390 70 370 70"/><path class="flow" stroke="var(--cold2)" d="M370 70H250Q232 70 232 88V120"/><path class="flow" stroke="var(--cold)" d="M232 122V157Q232 175 250 175H370"/>
   <circle class="pump" cx="310" cy="175" r="15"/><path class="rotor" d="M310 163l7 12-7 12-7-12z" fill="var(--cold)"/>
  </g>
  <g transform="translate(210 122)"><rect class="unit" x="-20" y="-58" width="40" height="116" rx="13"/><path class="plate" d="M-11-44v88M-4-44v88M4-44v88M11-44v88"/><text class="label" x="0" y="72" text-anchor="middle">WÄRMETAUSCHER</text></g>
  <foreignObject x="50" y="73" width="42" height="42"><div xmlns="http://www.w3.org/1999/xhtml" class="weather-symbol" id="weatherIcon">☀️</div></foreignObject>
  <image class="asset solar-asset" href="__SOLAR_ASSET__" x="-10" y="70" width="118" height="71" preserveAspectRatio="xMidYMid meet"/><text class="name" x="49" y="153" text-anchor="middle">SOLARABSORBER</text>
  <image class="asset pool-asset" href="__POOL_ASSET__" x="326" y="56" width="98" height="98" preserveAspectRatio="xMidYMid meet"/><text class="name" x="375" y="153" text-anchor="middle">POOL</text>
  <g transform="translate(48 38)"><text class="label">PRIMÄR VORLAUF</text><text class="value" id="pf" y="17">–</text></g>
  <g transform="translate(48 184)"><text class="label">RÜCKLAUF</text><text class="value" id="pr" y="17">–</text></g>
  <g transform="translate(372 38)" text-anchor="end"><text class="label">SEKUNDÄR RÜCKLAUF</text><text class="value" id="sr" y="17">–</text></g>
  <g transform="translate(372 184)" text-anchor="end"><text class="label">VORLAUF</text><text class="value" id="sf" y="17">–</text></g>
 </svg></div>
 <div class="offline" id="offline" hidden></div>
</section>
<script>
const $=id=>document.getElementById(id),fmt=v=>`${Number(v).toLocaleString('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1})} °C`;
function weatherIcon(code,day=true){code=Number(code);if(code===0)return day?'☀️':'🌙';if(code<=2)return day?'🌤️':'☁️';if(code===3)return'☁️';if(code===45||code===48)return'🌫️';if([51,53,55,56,57].includes(code))return'🌦️';if([61,63,65,66,67,80,81,82].includes(code))return'🌧️';if([71,73,75,77,85,86].includes(code))return'🌨️';if(code>=95)return'⛈️';return day?'☀️':'🌙'}
function render(s){$('primary').classList.toggle('on',!!s.primaryPump);$('secondary').classList.toggle('on',!!s.secondaryPump);$('pf').textContent=fmt(s.primaryFlow);$('pr').textContent=fmt(s.primaryReturn);$('sf').textContent=fmt(s.secondaryFlow);$('sr').textContent=fmt(s.secondaryReturn);$('weatherIcon').textContent=weatherIcon(s.weatherCode,!!s.isDay);$('offline').hidden=!!s.valid;$('offline').textContent=s.error||'Poolheizungsdaten nicht verfügbar';$('start').disabled=$('stop').disabled=false}
function command(name){$('start').disabled=$('stop').disabled=true;requestAction(name,true)}
$('start').onclick=e=>{e.stopPropagation();command('Start')};$('stop').onclick=e=>{e.stopPropagation();command('Stop')};
function handleMessage(data){render(typeof data==='string'?JSON.parse(data):data)}render(__INITIAL_STATE__);
</script></body></html>

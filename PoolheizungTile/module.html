<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:light dark;--line:color-mix(in srgb,CanvasText 16%,transparent);--panel:color-mix(in srgb,Canvas 92%,transparent);--hot:#f0782c;--hot2:#e8a33d;--cold:#129bc9;--cold2:#38b7d7;--ok:#20a36b;--danger:#dc5362;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;color:CanvasText}body{padding:8px}.card{position:relative;height:100%;min-height:226px;padding:9px;border:1px solid var(--line);border-radius:16px;background:radial-gradient(circle at 15% 20%,#ffd84d18,transparent 28%),radial-gradient(circle at 87% 30%,#25bfe819,transparent 30%),var(--panel);overflow:hidden}.title-space{height:28px}.actions{position:absolute;top:34px;right:11px;z-index:8;display:flex;gap:5px}.actions button{height:25px;padding:2px 10px;border:1px solid var(--line);border-radius:8px;color:#fff;font:.65rem system-ui;font-weight:800;cursor:pointer}.start{background:#1e9d69}.stop{background:#d04b5b}.schema{height:calc(100% - 31px)}svg{width:100%;height:100%}.base{fill:none;stroke:color-mix(in srgb,CanvasText 15%,transparent);stroke-width:18;stroke-linecap:round}.flow{fill:none;stroke-width:5;stroke-linecap:round;stroke-dasharray:3 12;opacity:.22}.on .flow{opacity:1;animation:flow 1.1s linear infinite}.secondary .flow{animation-direction:reverse}@keyframes flow{to{stroke-dashoffset:-30}}.unit{fill:color-mix(in srgb,Canvas 88%,transparent);stroke:var(--line);stroke-width:1.5}.plate{stroke:color-mix(in srgb,CanvasText 45%,transparent);stroke-width:4}.pump{fill:Canvas;stroke:color-mix(in srgb,CanvasText 24%,transparent);stroke-width:2}.on .pump{stroke:var(--ok);filter:drop-shadow(0 0 5px #20a36b99)}.rotor{transform-box:fill-box;transform-origin:center}.on .rotor{animation:spin 1.4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.label{font-size:8px;font-weight:800;letter-spacing:.08em;fill:currentColor;opacity:.58}.value{font-size:14px;font-weight:850;fill:currentColor}.name{font-size:10px;font-weight:800;fill:currentColor}.sun{fill:#f6c638}.moon{fill:#8ca8ba}.offline{position:absolute;inset:40px 10px 10px;display:grid;place-items:center;text-align:center;border-radius:11px;background:color-mix(in srgb,Canvas 91%,var(--danger) 9%);color:var(--danger);font-size:.68rem;font-weight:750}[hidden]{display:none!important}
</style></head><body>
<section class="card">
 <div class="title-space"></div>
 <div class="actions"><button class="start" id="start">▶ Start</button><button class="stop" id="stop">■ Stopp</button></div>
 <div class="schema"><svg viewBox="0 0 420 215" aria-label="Hydraulikschema der Poolheizung">
  <g class="primary" id="primary"><path class="base" d="M50 70H170Q188 70 188 88V157Q188 175 170 175H50Q30 175 30 155V90Q30 70 50 70"/><path class="flow" stroke="var(--hot)" d="M50 70H170Q188 70 188 88V120"/><path class="flow" stroke="var(--hot2)" d="M188 122V157Q188 175 170 175H50"/>
   <circle class="pump" cx="110" cy="175" r="15"/><path class="rotor" d="M110 163l7 12-7 12-7-12z" fill="var(--hot)"/>
  </g>
  <g class="secondary" id="secondary"><path class="base" d="M370 70H250Q232 70 232 88V157Q232 175 250 175H370Q390 175 390 155V90Q390 70 370 70"/><path class="flow" stroke="var(--cold2)" d="M370 70H250Q232 70 232 88V120"/><path class="flow" stroke="var(--cold)" d="M232 122V157Q232 175 250 175H370"/>
   <circle class="pump" cx="310" cy="175" r="15"/><path class="rotor" d="M310 163l7 12-7 12-7-12z" fill="var(--cold)"/>
  </g>
  <g transform="translate(210 122)"><rect class="unit" x="-20" y="-58" width="40" height="116" rx="13"/><path class="plate" d="M-11-44v88M-4-44v88M4-44v88M11-44v88"/><text class="label" x="0" y="72" text-anchor="middle">WÄRMETAUSCHER</text></g>
  <g transform="translate(88 112)"><circle id="dayIcon" class="sun" cx="0" cy="-18" r="14"/><path d="M-32 27Q0-8 32 27v15h-64z" fill="#303b40"/><path d="M-26 26Q0 0 26 26" fill="none" stroke="#68a9bc" stroke-width="5"/><text class="name" x="0" y="57" text-anchor="middle">SOLARABSORBER</text></g>
  <g transform="translate(332 110)"><path d="M-34 7q34-30 68 0v29q-34 18-68 0z" fill="#20aeda" opacity=".7"/><path d="M-29 18q8-7 16 0t16 0t16 0t16 0" fill="none" stroke="#dffaff" stroke-width="3"/><text class="name" x="0" y="57" text-anchor="middle">POOL</text></g>
  <g transform="translate(48 29)"><text class="label">PRIMÄR VORLAUF</text><text class="value" id="pf" y="17">–</text></g>
  <g transform="translate(48 196)"><text class="label">RÜCKLAUF</text><text class="value" id="pr" y="17">–</text></g>
  <g transform="translate(372 29)" text-anchor="end"><text class="label">SEKUNDÄR RÜCKLAUF</text><text class="value" id="sr" y="17">–</text></g>
  <g transform="translate(372 196)" text-anchor="end"><text class="label">VORLAUF</text><text class="value" id="sf" y="17">–</text></g>
 </svg></div>
 <div class="offline" id="offline" hidden></div>
</section>
<script>
const $=id=>document.getElementById(id),fmt=v=>`${Number(v).toLocaleString('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1})} °C`;
function render(s){$('primary').classList.toggle('on',!!s.primaryPump);$('secondary').classList.toggle('on',!!s.secondaryPump);$('pf').textContent=fmt(s.primaryFlow);$('pr').textContent=fmt(s.primaryReturn);$('sf').textContent=fmt(s.secondaryFlow);$('sr').textContent=fmt(s.secondaryReturn);$('dayIcon').classList.toggle('sun',!!s.isDay);$('dayIcon').classList.toggle('moon',!s.isDay);$('offline').hidden=!!s.valid;$('offline').textContent=s.error||'Poolheizungsdaten nicht verfügbar';$('start').disabled=$('stop').disabled=false}
function command(name){$('start').disabled=$('stop').disabled=true;requestAction(name,true)}
$('start').onclick=e=>{e.stopPropagation();command('Start')};$('stop').onclick=e=>{e.stopPropagation();command('Stop')};
function handleMessage(data){render(typeof data==='string'?JSON.parse(data):data)}render(__INITIAL_STATE__);
</script></body></html>
